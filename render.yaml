services:
  - type: web
    name: zd-electronic-deals
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn zd_electronics.wsgi:application"
    plan: free
    region: frankfurt
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: zd-db
          property: connectionString

databases:
  - name: zd-db
    plan: free
    region: frankfurt
